<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CORS Experiment - Profile API</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 720px; margin: 50px auto; padding: 0 18px; }
    button { padding: 10px 18px; cursor: pointer; }
    pre { background: #f2f2f2; padding: 16px; border-radius: 8px; white-space: pre-wrap; }
    #status { font-weight: bold; }
  </style>
</head>
<body>
  <h1>Skill Experiment 5: Securing APIs with CORS</h1>
  <p>Frontend origin: <code>http://localhost:5500</code></p>
  <p>Backend endpoint: <code>http://localhost:8080/profile</code></p>
  <button id="fetchBtn">Fetch Profile</button>
  <p id="status">Status: Waiting for request</p>
  <pre id="output">Click "Fetch Profile" to call the API.</pre>

  <script>
    document.getElementById("fetchBtn").addEventListener("click", async () => {
      const status = document.getElementById("status");
      const output = document.getElementById("output");
      status.textContent = "Status: Sending request...";
      try {
        const response = await fetch("http://localhost:8080/profile");
        if (!response.ok) throw new Error(`HTTP error: ${response.status}`);
        const data = await response.json();
        status.textContent = "Status: SUCCESS - CORS access allowed";
        output.textContent = JSON.stringify(data, null, 2);
      } catch (error) {
        status.textContent = "Status: FAILED - request blocked or API unavailable";
        output.textContent = error + "\n\nOpen browser Developer Tools (F12) → Console for the CORS error details.";
      }
    });
  </script>
</body>
</html>
